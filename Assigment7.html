<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Microscopy Practical: Phase Contrast</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.css">
    
    <style>
        /* Base Setup */
        body, html {
            height: 100%;
            margin: 0;
            text-align: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden; /* Prevents scrollbars during the simulation */
        }

        .container {
            display: grid;
            grid-template-rows: 15% 85%;
            height: 100%;
            width: 100%;
        }

        /* Top Row Navigation */
        .top-row {
            display: grid;
            grid-template-rows: 70% 30%;
        }

        .top-row-top {
            grid-column: 1 / 3;
            display: grid;
            grid-template-columns: 1fr 3fr 1fr;
            background-color: #001158;
            color: white;
            justify-content: center;
            align-items: center;
        }

        .top-row-bottom {
            grid-column: 1 / 3;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            background-color: #001158;
            color: white;
            border-top: 1px solid #1a2a6e;
        }

        /* Bottom Row Main Content */
        .bottom-row {
            height: 100%;
            display: grid;
            grid-template-columns: 50% 50%;
        }

        /* Left Panel (Instructions & Buttons) */
        .bottom-left {
            display: grid;
            grid-template-rows: 10% 60% 30%;
            background-color: lightblue;
        }

        .bottom-left-top {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: rgb(209, 218, 255);
            padding: 5px;
        }

        .bottom-left-middle {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: rgb(255, 255, 255);
            position: relative;
            padding: 20px;
        }

        .bottom-left-bottom {
            background-color: rgb(133, 146, 188);
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            justify-content: center;
            align-items: center;
            gap: 10px;
            padding: 15px;
        }

        /* Right Panel (Microscope Image) */
        .bottom-right {
            display: flex;
            background-color: rgb(255, 255, 255);
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        img#Microscope {
            height: 100%;
            width: 100%;
            object-fit: contain;
            max-width: 100%;
            max-height: 100%;
        }

        /* Elements Styling */
        #Assignment { font-size: 2.2em; margin: 0; color: white; }
        #counthead { font-size: 1.4em; margin: 0; color: #333; }
        #question { font-size: 1.8em; white-space: pre-wrap; margin: 0; color: #000; }
        #explanation { grid-column: 1 / 4; white-space: pre-wrap; margin-bottom: 5px; font-weight: bold; }

        button {
            padding: 8px 12px;
            cursor: pointer;
            font-weight: 600;
            border-radius: 4px;
            border: 1px solid #ccc;
            transition: all 0.2s;
        }

        button:hover { background-color: #e0e0e0; }
        button:focus { outline: none; }
    </style>
</head>

<body>
    <div class="container">
        <header class="top-row">
            <div class="top-row-top">
                <div class="top-row-left">
                    <a href="assigment6.html"><button id="Previous">Previous Assignment</button></a>
                </div>
                <div class="top-row-middle">
                    <h1 id="Assignment">Assignment 7 </h1>
                </div>
                <div class="top-row-right">
                    <a href="assignment8.html"><button id="Next">Next Assignment</button></a>
                </div>
            </div>
            <div class="top-row-bottom">
                <button id="Olympus">Olympus Configuration</button>
                <button id="Zeiss">Zeiss Configuration</button>
            </div>
        </header>

        <main class="bottom-row">
            <section class="bottom-left">
                <div class="bottom-left-top">
                    <h2 id="counthead">Phase Alignment Procedure</h2>
                </div>
                <div class="bottom-left-middle">
                    <h3 id="question">Select the appropriate Phase Objective to begin.</h3>
                </div>  
                <div class="bottom-left-bottom">
                    <p id="explanation">Use the controls to adjust the microscope settings.</p>
                    <button id="zoomButton">Zoom Condenser</button>
                    <button id="loadButton">Load Sample</button>
                    <button id="ocularButton">Remove Ocular</button>
                    <button id="rotateLeft">Left View</button>
                    <button id="rotateFront">Front View</button>
                    <button id="rotateRight">Right View</button>
                </div>
            </section>

            <section id="micIm" class="bottom-right">
                <img id="Microscope" src="fotos/photoscope1.png" alt="Microscope Display">
            </section>
        </main>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.js"></script>
    <script>
        // Initial Toastr configuration
        toastr.options = {
            "closeButton": false,
            "positionClass": "toast-bottom-right",
            "timeOut": "3000"
        };
    </script>
    <script src="assigment7.js"></script> 
</body>
</html>
