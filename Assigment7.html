<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Microscopy Practical - Assignment 7</title>


    <style>/* Base Setup */
        body, html {
            height: 100%;
            margin: 0;
            text-align: center;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        .container {
            display: grid;
            grid-template-rows: 15% 85%;
            height: 100%;
            width: 100%;
        }

/* Top Row Navigation */
        .top-row {
            display: grid;
            grid-template-rows: 70% 30%;
        }

        .top-row-top {
            grid-column: 1 / 3;
            display: grid;
            grid-template-columns: 1fr 3fr 1fr;
            background-color: #001158;
            color: white;
            justify-content: center;
            align-items: center;
        }

        .top-row-left, .top-row-right, .top-row-middle {
            background-color: rgb(0, 17, 88);
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #Assignment {
            font-size: 2.5em;
            margin: 0;
            color: white;
        }

        button {
            padding: 10px 20px;
            cursor: pointer;
            font-size: 1rem;
        }

        /* BOTTOM SECTION */
        .bottom-row {
            display: flex;
            height: 85vh;
            width: 100%;
            align-items: stretch;
        }

        .bottom-left {
            flex: 1;
            display: grid;
            grid-template-rows: 10% 60% 30%;
            background-color: lightblue;
        }

        .bottom-left-top {
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: rgb(209, 218, 255);
            justify-content: center;
        }

        .bottom-left-middle {
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: rgb(255, 255, 255);
            justify-content: center;
            position: relative;
            padding: 20px;
        }

        .bottom-left-bottom {
            background-color: rgb(133, 146, 188);
            display: grid;
            grid-template-columns: 1fr;
            justify-content: center;
            align-items: center;
            padding: 10px;
        }

        .bottom-right {
            flex: 1;
            background-color: #f8f9fa;
            border: 2px solid #ddd;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        #Microscope {
            max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    cursor: pointer;
    display: block; 
    transition: transform 0.8s ease-in-out; /*animación */
    transform: scale(1) translate(0, 0); /* Estado inicial */
}

        #AssignmentInfo { font-size: 1.8em; color: #001158; margin: 0; }
        
        #instruction {
            font-size: 1.8em;
            color: #555;
            margin-bottom: 20px;
            white-space: pre-wrap;
        }

        #question {
            font-size: 3em;
            color: #001158;
            margin-top: 20px;
            white-space: pre-wrap;
        }

        #explanation {
            font-size: 1.5em;
            color: white;
            white-space: pre-wrap;
            margin: 0;
        }
    </style>

    <div class="container">
        <div class="top-row">
            <div class="top-row-top">
                <div class="top-row-left">
                    <a href="Assigment6.html">
                        <button id="Previous">Previous Assignment</button>
                    </a>
                </div>
                <div class="top-row-middle">
                    <h1 id="Assignment">Assignment 7</h1>
                </div>
                <div class="top-row-right">
                    <a href="Assignment8.html">
                        <button id="Next">Next Assignment</button>
                    </a>
                </div>
            </div>
        </div>

        <div class="bottom-row">
            <div class="bottom-left">
                <div class="bottom-left-top" id="bottom-left-top">
                    <h1 id="AssignmentInfo">DIC & Fluorescence Identification</h1>
                </div>
                
                <div class="bottom-left-middle" id="bottom-left-middle">
                    <h3 id="instruction">Identify the requested component on the microscope.</h3>
                    <h1 id="question">Loading...</h1>
                </div> 

                <div class="bottom-left-bottom" id="bottom-left-bottom">
                    <h1 class="explanation" id="explanation">Follow the steps to explore the internal parts.</h1>
                </div>
            </div>
          
            <div id="micIm" class="bottom-right">
                <img id="Microscope" 
                     src="fotos/PHOTO FRONT OF ZEISS.JPG" 
                     alt="Microscope Diagram">
            </div>
        </div>

        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.css">

        <script src="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.js"></script>
