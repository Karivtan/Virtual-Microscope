<!DOCTYPE html>
<html>
<head>
    <title>Microscopy Practical - Assignment 11 Diffraction patterns</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.css">
    <style>
        body, html {
        height: 100%;
        margin: 0;
        text-align:center;
        font-family: Arial, sans-serif;
        overflow: hidden;
        }
        .container {
        display: grid;
        grid-template-rows: 15% 85%;
        height: 100%;
        width: 100%;
        }
        .top-row {
        display: grid;
        grid-template-rows: 70% 30%;
        }
        .top-row-top {
        grid-column: 1 / 3;
        display: grid;
        grid-template-columns: 1fr 3fr 1fr;
        background-color: #001158;
        color: white;
        justify-content: center;
        align-items: center;
        }
        .top-row-bottom {
        grid-column: 1 / 3;
        display: flex;
        background-color: #001158;
        color: white;
        justify-content: center;
        align-items: center;
        gap: 10px;
        }
        button { cursor: pointer;
        padding: 5px 15px;
        border-radius: 4px;
        border: 1px solid #ccc;
        }
        #Assignment {
        font-size: 2.5em;
        margin: 0;
        color: white;
        }
        .bottom-row {
        height: 100%;
        display: grid;
        grid-template-columns: 50% 50%;
        }
        .bottom-left {
        display: grid;
        grid-template-rows: 10% 65% 25%;
        background-color: lightblue;
        }
        .bottom-left-top {
        background-color: rgb(209, 218, 255);
        display: flex;
        align-items: center;
        justify-content: center;
        }
        .bottom-left-middle {
        background-color: white;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        position: relative;
        overflow: hidden;
        }
        .bottom-left-bottom {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 10px;
}
        .bottom-right {
        display: grid;
        background-color: white;
        justify-items: center;
        align-items: center;
        overflow: hidden;
        position: relative;
        }
        #Microscope {
        height: 100%;
        width: 100%;
        object-fit: contain;
        }
        .controls-container {
            width: 98% !important; 
    display: flex !important;
    flex-direction: row !important; 
    justify-content: space-around;
    background: transparent !important; 
    box-shadow: none !important; 
    padding: 0 !important;
}
        .selector-group {
            color: white; 
    font-size: 0.8em;
}
        select, input {
        width: 150px;
        }
        #explanation {
            color: white; 
    margin-bottom: 5px;
}
        .active-telescope {
        background-color: #ffc107 !important;
        color: black !important;
        }
        </style> 
</head>
<body>
    <div class="container">
        <div class="top-row">
            <div class="top-row-top">
               <div class="top-row-left">
                    <a href="assigment9p.html"><button>Previous Assignment</button></a>
                </div>
                <div class="top-row-middle"><h1 id="Assignment">Assignment 11:Abbe's theory</h1></div>
                <div class="top-row-right"><button onclick="location.href='assignment11p.html'">Next</button></div>
            </div>
            <div class="top-row-bottom">
            
                <button id="Leica">Leica</button>
            </div>
        </div>
        <div class="bottom-row">
            <div class="bottom-left">
                <div class="bottom-left-top"><h2 id="counthead">Abbe's theory & resolution</h2></div>
                
                <div class="bottom-left-middle" id="bottom-left-middle">
                    </div>  

                <div class="bottom-left-bottom">
                    <p id="explanation">Microscope ready. Load a specimen to study diffraction.</p>
                
                    <div class="controls-container">
                        <div class="selector-group">
                            <label>1. Specimen:</label>
                            <select id="sample-sel">
                                <option value="none">No Sample</option>
                                <option value="500">Grating 500 l/mm</option>
                                <option value="1000">Grating 1000 l/mm</option>
                                <option value="diatom1">Diatom1 </option>
                                <option value="diatom2">Diatom2 </option>
                            </select>
                        </div>
                        <div class="selector-group">
                            <label>2. Objective:</label>
                            <select id="obj-sel">
                                <option value="10">10x (NA 0.25)</option>
                                <option value="40" selected>40x (NA 0.65)</option>
                                <option value="100">100x (NA 1.25)</option>
                            </select>
                        </div>
                        <div class="selector-group" style="display: none;">
                            <label>3. Aperture Control:</label>
                            <input type="range" id="iris-slider" min="5" max="100" value="80">
                        </div>
                        
                        <div style="display: flex; gap: 5px;">
                            <button id="loadButton" style="background: #28a745; color: white;">Load Specimen</button>
                            <button id="ocularButton" style="background: #001158; color: white;">remove Eyepiece</button>
                        </div>
                    </div>
                </div>
            </div>
            <div class="bottom-right"><img id="Microscope" src="fotos/LeicaFront.png"></div>
        </div>
        </div>
    </div>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.js"></script>
    <script src="Assignment10p.js"></script> 
</body>
</html>
