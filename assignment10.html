<!DOCTYPE html>
<html>
<head>
    <title>Microscopy Practical - Assignment 10</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.css">
    <style>
        body, html {
            height: 100%;
            margin: 0;
            text-align: center;
            font-family: Arial, sans-serif;
        }

        .container {
            display: grid;
            grid-template-rows: 15% 85%;
            height: 100%;
            width: 100%;
        }

        /* --- TOP ROW --- */
        .top-row {
            display: grid;
            grid-template-rows: 70% 30%;
        }

        .top-row-top {
            grid-column: 1 / 3;
            display: grid;
            grid-template-columns: 1fr 3fr 1fr;
            background-color: #001158;
            color: white;
            justify-content: center;
            align-items: center;
        }

        .top-row-bottom {
            grid-column: 1 / 3;
            display: flex;
            background-color: #001158;
            color: white;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        button {
            cursor: pointer;
            padding: 5px 15px;
        }

        #Assignment {
            font-size: 2.5em;
            margin: 0;
            color: white;
        }

        /* --- BOTTOM ROW --- */
        .bottom-row {
            height: 100%;
            display: grid;
            grid-template-columns: 50% 50%;
        }

        .bottom-left {
            display: grid;
            grid-template-rows: 10% 60% 30%;
            background-color: lightblue;
        }

        .bottom-left-top {
            background-color: rgb(209, 218, 255);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Área de Trabajo / Taller */
        .bottom-left-middle {
            background-color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            padding: 20px;
        }

        .bottom-left-bottom {
            background-color: rgb(133, 146, 188);
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            justify-content: center;
            align-items: center;
            padding: 10px;
        }

        .bottom-right {
            display: grid;
            background-color: white;
            justify-items: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        #Microscope {
            height: 100%;
            width: 100%;
            object-fit: contain;
        }

        /* --- ESTILOS DEL TALLER (WORKSHOP) --- */
        .workshop-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 90%;
            background: #f4f7ff;
            padding: 20px;
            border: 2px solid #001158;
            border-radius: 10px;
            text-align: left;
        }

        .filter-group {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        select {
            padding: 8px;
            width: 180px;
        }

        .btn-test {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 12px;
            font-weight: bold;
            border-radius: 5px;
            margin-top: 10px;
        }

        .btn-workshop {
            background-color: #001158;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1.2em;
            border-radius: 5px;
        }

        #explanation {
            grid-column: 1 / 4;
            white-space: pre-wrap;
            font-weight: bold;
            padding: 5px;
        }

        /* --- MEJORA DE LA IMAGEN DEL CUBO --- */
        .cube-image-container {
            text-align: center;
            margin-bottom: 10px;
            background: white;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #ddd;
            position: relative;
            transition: transform 0.3s ease; /* Transición suave */
            cursor: zoom-in;
            z-index: 5;
        }

        /* Efecto al pasar el ratón */
        .cube-image-container:hover {
            transform: scale(1.8); /* Se agranda un 60% */
            z-index: 100; /* Se pone por delante de todo */
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }

        .cube-image-container img {
            max-width: 180px;
            height: auto;
            display: block;
            margin: 0 auto;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="top-row">
            <div class="top-row-top">
                <div class="top-row-left">
                    <a href="assignment9.html"><button>Previous Assignment</button></a>
                </div>
                <div class="top-row-middle">
                    <h1 id="Assignment">Assignment 10</h1>
                </div>
                <div class="top-row-right">
                    <a href="Assignment11.html"><button>Next Assignment</button></a>
                </div>
            </div>
            <div class="top-row-bottom">
                <button id="Zeiss">Zeiss</button>
            </div>
        </div>

        <div class="bottom-row">
            <div class="bottom-left">
                <div class="bottom-left-top">
                    <h2 id="counthead">Fluorescence Microscope Assembly</h2>
                </div>

                <div class="bottom-left-middle" id="bottom-left-middle">
                    <div id="view-start">
                        <h3 id="question">The filter block is empty!</h3>
                        <p>You need to observe a sample with GFP.</p>
                        <button class="btn-workshop" onclick="showWorkshop()">Go to Workshop</button>
                    </div>

                    <div id="view-workshop" class="workshop-container" style="display: none;">
                        <h3 style="margin-top:0;">Filter Cube Workshop</h3>

                        <div class="cube-image-container">
                            <img src="fotos/filterblock.jpeg" alt="Filter Cube Diagram">
                            <p style="font-size: 0.65em; color: #666; margin: 5px 0 0 0;">
                                (Hover to zoom)
                            </p>
                        </div>
                        
                        <p style="font-size: 0.9em; color: #555;">Choose components for GFP excitation and emission:</p>
                        
                        <div class="filter-group">
                            <label><strong>1. Exciter Filter:</strong></label>
                            <select id="exciter-sel">
                                <option value="none">-- Select --</option>
                                <option value="blue">Blue (470/40 nm)</option>
                                <option value="green">Green (545/25 nm)</option>
                                <option value="uv">UV (365/10 nm)</option>
                            </select>
                        </div>

                        <div class="filter-group">
                            <label><strong>2. Dichroic Mirror:</strong></label>
                            <select id="dichroic-sel">
                                <option value="none">-- Select --</option>
                                <option value="495">495 nm Cutoff</option>
                                <option value="570">570 nm Cutoff</option>
                            </select>
                        </div>

                        <div class="filter-group">
                            <label><strong>3. Emission Filter:</strong></label>
                            <select id="emitter-sel">
                                <option value="none">-- Select --</option>
                                <option value="green">Green (525/50 nm)</option>
                                <option value="red">Red (610/75 nm)</option>
                            </select>
                        </div>

                        <button class="btn-test" onclick="testBlock()">Install & Test Block</button>
                        <button onclick="hideWorkshop()" style="margin-top:5px; border:none; background:none; color:blue; cursor:pointer; text-decoration:underline;">Cancel</button>
                    </div>
                </div>  

                <div class="bottom-left-bottom">
                    <p id="explanation">To begin, go to the workshop and assemble the filter block.</p>
                </div>
            </div>

            <div id="micIm" class="bottom-right">
                <img id="Microscope" src="fotos/ZeissRight.jpg" alt="Microscope">
            </div>
        </div>
    </div>
    
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.js"></script>
    <script src="assignment10.js"></script> 
</body>
</html>
