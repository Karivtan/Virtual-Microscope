<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Microscopy Practical - Assignment 3</title>
    <style>
        body, html { 
            height: 100%;
            margin: 0;
            text-align: center; 
            font-family: sans-serif;
            overflow: hidden;
        }

        .container { 
            display: grid; 
            grid-template-rows: 15% 85%; 
            height: 100%; 
            width: 100%;
        }

        .top-row { 
            display: grid; 
            grid-template-rows: 70% 30%; 
        }

        .top-row-top {
            grid-column: 1 / 3; 
            display: grid; 
            grid-template-columns: 1fr 3fr 1fr; 
            background-color: #001158; 
            color: white; 
            justify-content: center; 
            align-items: center; 
        }

        .top-row-left, .top-row-right, .top-row-middle { 
            background-color: rgb(0, 17, 88); 
        }

        .top-row-bottom {
            grid-column: 1 / 3;
            background-color: #001158;
            color: white; 
            display: flex; 
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .bottom-row { 
            height: 100%;
            display: grid;
            grid-template-columns: 50% 50%; 
        }

        .bottom-left {
            display: grid; 
            grid-template-rows: 10% 60% 30%;
            background-color: lightblue;
        }

        .bottom-left-top { 
            background-color: rgb(209, 218, 255); 
            justify-content: center; 
            display: flex; 
            align-items: center; 
        }

        .bottom-left-middle {
            background-color: rgb(255, 255, 255); 
            position: relative; 
            display: flex; 
            flex-direction: column;
            padding: 20px;
            align-items: center;
            justify-content: center; 
            height: 250px; 
            overflow: hidden;
        }

        .bottom-left-bottom { 
            background-color: rgb(133, 146, 188);
            display: grid;
            grid-template-columns: 1fr 1fr; 
            gap: 10px;
            padding: 10px;
            height: auto;
        }
        
        .bottom-right { 
            display: flex;
            justify-content: center; 
            align-items: center; 
            background-color: white;
            overflow: hidden; 
            position: relative; 
        }

        #Assignment { 
            font-size: 2.5em; 
            color: white; 
            margin: 0;
        }

        #counthead {
            font-size: 2em;
            margin: 0;
        }

        #question {  
            font-size: 1.1em;
            line-height: 1.4;
            margin: 5px 0;
            white-space: normal;
        }
        
        #Microscope { 
            width: 100%;
            height: 100%;
            object-fit: contain; 
            display: block;
            z-index: 1; 
        }

        button { 
            padding: 10px 5px; 
            font-size: 0.9em; 
            font-weight: bold;
            cursor: pointer;
            white-space: nowrap; 
            overflow: hidden;
            text-overflow: ellipsis; 
        }

        button:disabled {
            cursor: not-allowed;
            opacity: 0.6;
        }

        #knobSlider {
            width: 90%; 
            margin-top: 10px; 
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="top-row">
            <div class="top-row-top">
                <div class="top-row-left"><a href="Assignment12p.html"><button>Previous Assignment</button></a></div>
                <div class="top-row-middle"><h1 id="Assignment"> Assignment 13: Perspex Block and Phase Contrast</h1></div>
                <div class="top-row-right"><a href="assignment11p.html"><button>Next Assignment</button></a></div>
            </div>
            <div class="top-row-bottom"><button>Zeiss</button></div>
        </div>
        <div class="bottom-row">
            <div class="bottom-left">
                <div class="bottom-left-top"><h1 id="counthead">Check the light cone effect</h1></div>
                <div class="bottom-left-middle">
                    <h3 id="question"><b>Step 1:</b> Prepare the microscope by removing the objective lens.</h3>
                    
                    <div id="knobControl" style="display:none; text-align:center; width:100%; margin-top: 15px;">
                        <p style="font-weight:bold; color:#001158; margin: 5px 0;">Open the aperture diaphragm completely to reveal the effect:</p>
                        <input type="range" id="knobSlider" min="0" max="100" value="0">
                    </div>
                </div>  
                <div class="bottom-left-bottom">
                    <button id="btnRemove">1. Remove objective</button>
                    <button id="btnPolarizer" disabled>2. Add Polarizer</button>
                    <button id="btnPerspex" disabled>3. Add Perspex block</button>
                    <button id="btnReset">Reset view</button>
                </div>
            </div>
            <div class="bottom-right" id="image-container-right">
                <img id="Microscope" src="fotos/ZeissLeft.png" alt="Microscope">
            </div>
        </div>
    </div>
    <script src="Assignment13.js"></script> 
</body>
</html>
