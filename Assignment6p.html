<!DOCTYPE html>
<html>
<title>Microscopy practical</title>

<style>
body, html {
  height: 100%; /* Ensure body and html take full browser height */
  margin: 0;   /* Remove default margins */
  text-align: center;
}

.container {
  display: grid;
  grid-template-rows: 15% 85%; 
  height: 100%;
  width: 100%;
}
.top-row {
  display: flex;
  flex-direction: column; 
  background-color: #001158;
}
.top-row-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px 20px;
  flex: 1;
}
.top-row-left {
  background-color: rgb(0, 17, 88);
  flex: 0 0 auto; 
}

.top-row-right {
  background-color: rgb(0, 17, 88); 
  flex: 0 0 auto;
}

.top-row-middle {
  flex: 1; 
  display: flex;
  justify-content: center;
  align-items: center;
}

.top-row-bottom {
  display: flex;
  justify-content: center;
  gap: 20px;
  background-color: #000c3d;
  padding: 5px 0;
}
.bottom-row { /*bottom row contains bottom left, and bottom right */
    height: 100%;
    display: grid;
    grid-template-columns:50% 50%;
}


.bottom-left {
  display: grid;
  grid-template-rows: 0.5fr 5fr 3fr;
  flex-direction: column; /* Stack items vertically */
  background-color: lightblue; /* Example styling */
}

.bottom-left-top {
  flex: 1; /* Take up available space */
  flex-direction: column; /* Stack items vertically */
  align-items: center;
  background-color: rgb(209, 218, 255);
  justify-content: center;
    
}

.bottom-left {
  display: grid;
  grid-template-rows: 10% 60% 30%;
  flex-direction: column; /* Stack items vertically */
  background-color: lightblue; /* Example styling */
}

.bottom-left-top {
  flex-direction: column; /* Stack items vertically */
  align-items: center;
  background-color: rgb(209, 218, 255);
  justify-content: center;
    
}

.bottom-left-middle {
  flex-direction: column; /* Stack items vertically */
  align-items: center;
  background-color: rgb(255, 255, 255);
  justify-content: center;
  position: relative;
    
}

.bottom-left-bottom {
      background-color: rgb(133, 146, 188);
    /*display: flex; /* Center content if needed */
    display:grid;
    grid-template-columns: 1fr 1fr 1fr;
    justify-content: center;
    align-items: center;
}

.bottom-right {
    display:grid;
    height:100%;
    background-color: rgb(255, 255, 255); /* Example styling */
    justify-items: center;
    align-items: center;
    overflow:hidden;
    position:relative;
}


#Assignment {
  font-size: 1.6rem; 
    margin: 0;
    padding: 0;
    color: white;
    text-align: center;
    flex: 2; 
}
#counter {
    font-size: 2em;
    margin-bottom: 50px;

}

#counthead {
    font-size: 2em;
    margin-bottom: 50px;
    align-self: flex-start;
}
#question {
    font-size: 2em;
    margin-bottom: 50px;
    align-self: flex-start;
    white-space: pre-wrap; /* Important for \n to work */
}

#bottombutton{
    
}
#bottombutton:focus{
    outline:none;
}

#explanation{
  grid-column: 1 / 4; /* Span from column 1 to 4 (i.e., across 3 columns) */
  white-space: pre-wrap; /* Important for \n to work */
}

</style>

<body>
    <div class="container">
        <div class="top-row">

              </div>
