<!DOCTYPE html>
<html >
<head>
    <meta charset="UTF-8">
    <title>Microscopy Practical - Assignment 9</title>
    <style>
        
        body, html { 
            height: 100%;
             margin: 0;
              text-align: center; 
              font-family: sans-serif;
               overflow: hidden;
             }

        .container { 
            display: grid; 
            grid-template-rows: 15% 85%; 
            height: 100%; 
            width:100% 
        }

        .top-row { 
            display: grid; 
            grid-template-rows: 70% 30%; 
        }

        .top-row-top {
             grid-column: 1 / 3; 
             display: grid; 
             grid-template-columns: 1fr 3fr 1fr; 
             background-color: #001158; 
             color:white; 
             justify-content: center; 
             align-items: center; 
            }
        .top-row-left, .top-row-right, .top-row-middle { 
            background-color: rgb(0, 17, 88); 
        }

        .top-row-bottom {
             grid-column: 1 / 3;
              background-color: #001158;
               color:white; 
               display: flex; 
               justify-content: center;
                align-items: center;
                 gap: 10px;
                 }

        .bottom-row { 
            height: 100%;
             display: grid;
              grid-template-columns:50% 50%; 
            }

        .bottom-left {
             display: grid; 
             grid-template-rows: 10% 60% 30%;
              background-color: lightblue;
             }

        .bottom-left-top { 
            background-color: rgb(209, 218, 255); 
            justify-content: center; 
            display: flex; 
            align-items: center; 
        }


        .bottom-left-middle {
             background-color: rgb(255, 255, 255); 
             position: relative; 
             display: flex; 
             flex-direction: column;
              padding: 20px;
               align-items: center;
                justify-content: center; 
            }
        .bottom-left-bottom { 
            background-color: rgb(133, 146, 188);
             display:grid;
              grid-template-columns: 1fr 1fr 1fr;
               gap: 10px;
                padding: 10px;
             }
        
        
        .bottom-right { 
            display: flex;
             justify-content: center; 
             align-items: center; 
             background-color: white;
              overflow: hidden; 
              position: relative; 
            }
            .image-container {
    position: relative;
    height: 90%; 
    aspect-ratio: 4 / 3; 
    display: flex;
    justify-content: center;
    align-items: center;
}

        

        #Assignment { 

            font-size: 2.5em; 

            color:white; 
            margin: 0;
        
         }
        #counthead {
             font-size: 2em;
              margin: 0;
             }
        #question { 
            font-size: 1.8em;
             white-space: pre-wrap;
             }
        
        
        #Microscope { 
            width: 100%;
    height: 100%;
    object-fit: contain; 
    display: block;
    z-index: 1; 
}


        #LightEffect {
            position: absolute;
            left: 48%; 
            bottom: 40% ;
            transform: translateX(-50%)
             scaleX(0.2);
            transform-origin: bottom center;
            width: 40%;
            height: 50%;
            z-index: 2;
            opacity: 0;
            pointer-events: none;
            background: linear-gradient(to top, rgba(255, 255, 200, 1) 0%, rgba(255, 255, 255, 0) 100%);
            clip-path: polygon(0% 0%, 100% 0%, 50% 100%);
        }

        button { 
            padding: 10px;
             font-weight: bold;
              cursor: pointer;
             }
        #knobSlider {
             width: 80%; 
             margin-top: 20px; 
            }
            #knob-overlay {
    position: absolute;
    top: 62%;  
    left: 45%; 
    width: 12%; 
    aspect-ratio: 1 / 1;
    background: transparent; 
    border-radius: 50%;
    z-index: 10;
    cursor: ew-resize;
    transform: translate(-50%, -50%);
    display: none; 
}

    </style>
</head>
<body>
    <div class="container">
        <div class="top-row">
            <div class="top-row-top">
                <div class="top-row-left"><a href="assigment8.html"><button>Previous Assignment</button></a></div>
                <div class="top-row-middle"><h1 id="Assignment">Assignment 9</h1></div>
                <div class="top-row-right"><a href="assignment10.html"><button>Next Assignment</button></a></div>
            </div>
            <div class="top-row-bottom"><button>Zeiss</button></div>
        </div>
        <div class="bottom-row">
            <div class="bottom-left">
                <div class="bottom-left-top"><h1 id="counthead">Check the Light Cone Effect</h1></div>
                <div class="bottom-left-middle">
                    <h3 id="question">1. First, prepare the microscope by removing the objective.</h3>
                    <div id="knobControl" style="display:none; text-align:center; width:100%;">
                        <p style="font-weight:bold; color:#001158;">You can adjust the light cone by dragging the knob directly on the microscope image OR using the slider below:</p>
                        <input type="range" id="knobSlider" min="0" max="100" value="0">
                    </div>
                </div>  
                <div class="bottom-left-bottom">
                    <button id="btnRemove">1. Remove Objectives</button>
                    <button id="btnPerspex" disabled>2. Add Perspex Block</button>
                    <button id="btnReset">Reset View</button>
                </div>
            </div>
            <div class="bottom-right" id="image-container-right">
                <img id="Microscope" src="fotos/ZeissLeft.png" alt="Microscope">
                <div id="LightEffect"></div>
                <div id="knob-overlay"></div>
            </div>
        </div>
    </div>
    <script src="assignment9.js"></script> 
</body>
</html>
