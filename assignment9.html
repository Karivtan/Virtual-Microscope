<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Microscopy Practical - Assignment 9</title>
    <style>
        body, html {
          height: 100%; /* Ensure body and html take full browser height */
          margin: 0;   /* Remove default margins */
          text-align: center;
          font-family: sans-serif;
        }

        .container {
          display: grid;
          grid-template-rows: 15% 85%; /* 15% top, 85% bottom */
          height: 100%;
          width:100%
        }
        .top-row {
          display: grid;
          grid-template-rows: 70% 30%; /* top row split in two */
        }
        .top-row-top {
          grid-column: 1 / 3; /* Span across both columns */
          display: grid;
          grid-template-columns: 1fr 3fr 1fr; /* Three equal columns */
          flex-direction: row; /* Stack items vertically */
          background-color: #001158; /* Example styling */
          color:white;
          justify-content: center;
          align-items: center;
        }

        .top-row-left { background-color: rgb(0, 17, 88); }
        .top-row-right { background-color: rgb(0, 17, 88); }
        .top-row-middle { background-color: rgb(0, 17, 88); }

        .top-row-bottom {
          grid-column: 1 / 3; /* Span across both columns */
          grid-template-columns: 1fr 1fr 1fr 1fr; /* Three equal columns */
          background-color: #001158; /* Example styling */
          color:white;
          display: flex; /* Center content if needed */
          justify-content: center;
          align-items: center;
          gap: 10px;
        }

        .bottom-row { /*bottom row contains bottom left, and bottom right */
            height: 100%;
            display: grid;
            grid-template-columns:50% 50%;
        }

        .bottom-left {
          display: grid;
          grid-template-rows: 10% 60% 30%;
          flex-direction: column; /* Stack items vertically */
          background-color: lightblue; /* Example styling */
        }

        .bottom-left-top {
          flex-direction: column; /* Stack items vertically */
          align-items: center;
          background-color: rgb(209, 218, 255);
          justify-content: center;
          display: flex;
        }

        .bottom-left-middle {
          flex-direction: column; /* Stack items vertically */
          align-items: center;
          background-color: rgb(255, 255, 255);
          justify-content: center;
          position: relative;
          display: flex;
          padding: 20px;
        }

        .bottom-left-bottom {
            background-color: rgb(133, 146, 188);
            display:grid;
            grid-template-columns: 1fr 1fr 1fr;
            justify-content: center;
            align-items: center;
            gap: 10px;
            padding: 10px;
        }

        .bottom-right {
            display:grid;
            background-color: rgb(255, 255, 255); /* Example styling */
            justify-items: center;
            align-items: center;
            overflow:hidden;
            position:relative;
        }

        #Assignment { font-size: 2.5em; margin-bottom: 10px; color:white; }
        #counthead { font-size: 2em; align-self: center; }
        #question { font-size: 2em; align-self: center; white-space: pre-wrap; }

        #bottom-left-bottom button {
            padding: 10px;
            font-weight: bold;
            cursor: pointer;
        }
        #bottom-left-bottom button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* --- NUEVOS ESTILOS PARA LA LUZ DINÁMICA --- */
        .image-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #Microscope {
            max-height: 100%;
            width: auto;
            z-index: 1; /* Fondo */
            object-fit: contain;
        }

        /* --- CAMBIO AQUÍ: DIBUJAR EL CONO DE LUZ CON CSS --- */
        #LightEffect {
            position: absolute;
            /* Ubicación sobre la platina. Ajusta estos valores si no encaja. */
            bottom: 30%; 
            left: 45%;
            
            /* Tamaño base del haz */
            width: 120px;
            height: 180px;
            
            z-index: 2;
            opacity: 0; /* Empieza invisible */
            pointer-events: none;
            transition: transform 0.1s ease-out, opacity 0.2s ease-out;
            
            /* DIBUJO DEL CONO: Un triángulo con degradado blanco */
            background: radial-gradient(ellipse at bottom, rgba(255,255,255,0.9) 0%, rgba(255,255,255,0) 80%);
            clip-path: polygon(20% 0%, 80% 0%, 100% 100%, 0% 100%);
            
            
            mix-blend-mode: screen;
            transform-origin: bottom center; /* Para que crezca desde abajo */
        }

        /* Estilo para el slider del mando de luz */
        #knobSlider {
            width: 80%;
            margin-top: 20px;
        }

    </style>
</head>
<body>
    <div class="container">
        <div class="top-row">
            <div class="top-row-top">
                <div class="top-row-left">
                    <a href="assigment8.html">
                        <button id="Previous">Previous Assignment</button>
                    </a>
                </div>
                <div class="top-row-middle">
                    <h1 id="Assignment">Assignment 9</h1>
                </div>
                <div class="top-row-right">
                    <a href="Assignment10.hmtl">
                        <button id="Next">Next Assignment</button>
                    </a>
                </div>
            </div>
            <div class="top-row-bottom">
                <button id="Zeiss">Zeiss</button>
            </div>
        </div>

        <div class="bottom-row">
            <div class="bottom-left">
                <div class="bottom-left-top" id="bottom-left-top">
                    <h1 id="counthead">Check the Light Cone Effect</h1>
                </div>
                <div class="bottom-left-middle" id="bottom-left-middle">
                    <h3 id="question">1. First, prepare the microscope by removing the objective.</h3>
                    
                    <div id="knobControl" style="display:none; text-align:center; width:100%;">
                        <p>Rotate Condenser Knob (Change Light Cone):</p>
                        <input type="range" id="knobSlider" min="0" max="100" value="0">
                    </div>
                </div>  
                
                <div class="bottom-left-bottom" id="bottom-left-bottom">
                    <button class="bottombutton" id="btnRemove">1. Remove Objectives</button>
                    <button class="bottombutton" id="btnPerspex" disabled>2. Add Perspex Block</button>
                    
                    <button class="bottombutton" id="btnReset">Reset View</button>
                </div>
            </div>

            <div id="micIm" class="bottom-right">
                <div class="image-container">
                    <img id="Microscope" src="fotos/ZeissLeft.png" alt="Microscope" title="NB Reference">
                    
                    <div id="LightEffect"></div> 
                </div>
            </div>
        </div>
    </div>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.js"></script>
    <script>
        toastr.options = {
            "closeButton": false,
            "preventDuplicates": true,
            "positionClass": "toast-bottom-right",
            "timeOut": "2000",
        }
    </script>
    <script src="assignment9.js"></script> 
</body>
</html>
