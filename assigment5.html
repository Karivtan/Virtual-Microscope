
<!DOCTYPE html>

<style>
body, html {
  height: 100%; /* Ensure body and html take full browser height */
  margin: 0;   /* Remove default margins */
  text-align: center;
  font-family: Arial, sans-serif;
}

.container {
  display: grid;
  grid-template-rows: 15% 85%; /* 15% top, 85% bottom */
  height: 100%;
  width:100%
}
.top-row {
  display: grid;
            grid-template-rows: 100%; /* Simplificado para alineación */
        }
.top-row-top {
  grid-column: 1 / 3; /* Span across both columns */
  display: grid;
  grid-template-columns: 1fr 3fr 1fr; /* Three equal columns */
  flex-direction: row; /* Stack items vertically */
  background-color: #001158; /* Example styling */
  color:white;
  justify-content: center;
  align-items: center;
}

.top-row-left {
  background-color: rgb(0, 17, 88); /* Example styling */
}

.top-row-right {
  background-color: rgb(0, 17, 88); /* Example styling */
}

.top-row-middle {
  background-color: rgb(0, 17, 88); /* Example styling */
}

.top-row-bottom {
  grid-column: 1 / 3; /* Span across both columns */
  grid-template-columns: 1fr 1fr 1fr 1fr; /* Three equal columns */
  background-color: #001158; /* Example styling */
  color:white;
  display: flex; /* Center content if needed */
  justify-content: center;
  align-items: center;
}

.bottom-row { /*bottom row contains bottom left, and bottom right */
    height: 100%;
    display: grid;
    grid-template-columns:50% 50%;
}


.bottom-left {
  display: grid;
  grid-template-rows: 0.5fr 5fr 3fr;
  flex-direction: column; /* Stack items vertically */
  background-color: lightblue; /* Example styling */
}

.bottom-left-top {
  flex: 1; /* Take up available space */
  flex-direction: column; /* Stack items vertically */
  align-items: center;
  background-color: rgb(209, 218, 255);
  justify-content: center;
    
}

.bottom-left {
  display: grid;
  grid-template-rows: 10% 60% 30%;
  flex-direction: column; /* Stack items vertically */
  background-color: lightblue; /* Example styling */
}

.bottom-left-top {
  flex-direction: column; /* Stack items vertically */
  align-items: center;
  background-color: rgb(209, 218, 255);
  justify-content: center;
    
}

.bottom-left-middle {
  flex-direction: column; /* Stack items vertically */
  align-items: center;
  background-color: rgb(255, 255, 255);
  justify-content: center;
  position: relative;
    
}

.bottom-left-bottom {
      background-color: rgb(133, 146, 188);
    /*display: flex; /* Center content if needed */
    display:grid;
    grid-template-columns: 1fr 1fr 1fr;
    justify-content: center;
    align-items: center;
}

.bottom-right {
    flex: 1;
    display:grid;
    height:100%;
    background-color: rgb(255, 255, 255); /* Example styling */
    justify-items: center;
    align-items: center;
    overflow:hidden;
    position:relative;
    border: none;
}

#Assignment {
    font-size: 2.5em;
    margin-bottom: 0;
    color:white
}

#counter {
    font-size: 2em;
    margin-bottom: 50px;

}

#counthead {
    font-size: 2em;
    margin-bottom: 50px;
    align-self: flex-start;
}
#question {
    font-size: 2em;
    margin-bottom: 50px;
    align-self: flex-start;
    white-space: pre-wrap; /* Important for \n to work */
}
#instruction {
    font-size: 2em;
    margin-bottom: 50px;
    align-self: flex-start;
    white-space: pre-wrap; /* Important for \n to work */
}


#bottombutton{
    
}
#bottombutton:focus{
    outline:none;
}

#explanation{
  grid-column: 1 / 4; /* Span from column 1 to 4 (i.e., across 3 columns) */
  white-space: pre-wrap; /* Important for \n to work */
}

</style>
