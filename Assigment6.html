<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Microscopy Practical - Assignment 6</title>
    <style>
        
        body, html {
             height: 100%;
              margin: 0; 
              padding: 0;
               text-align: center;
                font-family: 'Segoe UI', sans-serif;
                 background-color: #f0f2f5;
                  overflow: hidden; 
                }
        .container { 
            display: flex;
             flex-direction: column; 
             height: 100vh;
             }
        .top-row-top { 
            display: grid; 
            grid-template-columns: 1fr 3fr 1fr; 
            background-color: #001158; 
            color: white; 
            align-items: center; 
            height: 15vh; 
        }
        .bottom-row { 
            display: flex; 
            height: 85vh; 
            width: 100%; 
        }
        .bottom-left {
             flex: 2; 
             display: flex; 
             flex-direction: column;
              background-color: rgb(209, 218, 255); 
              padding: 30px;
               border-right: 3px solid #ccc;
                justify-content: center; 
            }
        .bottom-right { 
            flex: 2;
             background-color:#111; 
             display: flex; 
             justify-content: center; 
             align-items: center; 
             position: relative; 
            }
        .map-wrapper {
             position: relative;
              display: inline-block; 
              line-height: 0;
             }
        #Microscope { 
            max-height: 75vh;
             width: auto; 
             box-shadow: 0 0 30px rgba(0,0,0,0.5);
             }
        .hotspot { 
            position: absolute; 
            cursor: pointer; 
            border: none; 
            background: transparent; 
            outline: none;
             z-index: 10;
             }
        #eyepiece-view { 
            width: 600px; 
            height: 600px; 
            border: 15px solid #222; 
            border-radius: 50%; 
            overflow: hidden; 
            display: none; 
            background: black; 
            position: relative;
    z-index: 5;
        }
        #sample-img { 
            width: 100%; 
            height: 100%;
             object-fit: cover;
              transition: filter 0.5s ease;
             }
        .blurry { 
            filter: blur(35px) brightness(0.6); 
        }
        .selector-zone {
             display: none;
              flex-direction: column; 
              gap: 20px;
               align-items: center; 
            }
        .slot-container {
             background: white;
              padding: 15px; 
              border-radius: 20px; 
              width: 90%;
               color: #333;
    box-shadow: 0 4px 8px rgba(0,0,0,0.1);
             }
        .nav-row {
             display: flex;
              align-items: center; 
              justify-content: space-between;
            }

        .slot-img { 
      /* controlas el tamaño visual */
    width: 280px;  
    height: 200px; 
    object-fit: contain;
    background: #fdfdfd;
    border: 3px solid #001158; 
    border-radius: 12px; 
    padding: 5px; 
    transition: transform 0.3s ease, box-shadow 0.3s ease; 
    cursor: zoom-in; /* Cambia el cursor para indicar que hay zoom */
    position: relative;
    z-index: 1;
}
/* Efecto al poner el ratón encima (Hover) */
.slot-img:hover {
    transform: scale(1.5); /* Aumenta el tamaño un 50% */
    z-index: 100; 
    box-shadow: 0 10px 30px rgba(0,0,0,0.5); 
    background: white; 
}
        .nav-btn { 
            background: #001158;
    color: white;
    padding: 15px 10px; 
    font-size: 1.4em;
    cursor: pointer; 
    border-radius: 8px;
    border: none;
}
             .nav-btn:hover {
    background: #0022aa;
}
        
        #Assignment {
             font-size: 2.2em; 
             color: white;
              margin: 0; 
            }
        #status-text { 
            font-size: 1.2em;
             font-weight: bold;
              margin-top: 15px;
             }
        button { 
            padding: 10px 20px; 
            cursor: pointer;
             background-color: #e0e0e0; 
             border: 1px solid #999;
              border-radius: 4px; 
            }
   
   </style>
</head>
<body>

    <div class="container">
        <div class="top-row-top">
            <div><a href="assigment5.html"><button>Previous Assignment</button></a></div>
            <div><h1 id="Assignment">Assignment 6</h1></div>
            <div><a href="Assigment7.html"><button>Next Assignment</button></a></div>
        </div>

        <div class="bottom-row">
            <div class="bottom-left">
                <div id="instruction-step">
                    <h1 style="color: #001158;">Step 1</h1>
                    <p style="font-size: 1.2em; margin: 5px 0;">Locate and click on the <b>Objective Turret</b>.</p>
                </div>

                <div id="step-2-selectors" class="selector-zone">
                    <h2 style="color: #001158;">Optical Alignment</h2>
                    
                    <div class="slot-container">
                        <span><b>OBJECTIVE</b></span>
                        <div class="nav-row">
                            <button class="nav-btn" onclick="change('obj', -1)">◀</button>
                            <img id="view-obj" src="fotos/OBJECTIVE10X.JPG" class="slot-img">
                            <button class="nav-btn" onclick="change('obj', 1)">▶</button>
                        </div>
                    </div>

                    <div class="slot-container">
                        <span><b>D.C. SETTING</b></span>
                        <div class="nav-row">
                            <button class="nav-btn" onclick="change('dc', -1)">◀</button>
                            <img id="view-dc" src="fotos/dc_0.png" class="slot-img">
                            <button class="nav-btn" onclick="change('dc', 1)">▶</button>
                        </div>
                    </div>

                    <p id="status-text"></p>
                </div>
            </div>

            <div class="bottom-right">
                <div id="initial-diagram" class="map-wrapper">
                    <img id="Microscope" src="fotos/photofrontscopeA1.jpg" alt="Microscope">
                    <div class="hotspot" style="top: 60.20%; left: 49.30%; width: 25%; height: 25%;" onclick="startLab()"></div>
                </div>
                <div id="eyepiece-view">
                    <img id="sample-img" src="samples/CheekEpithelialCellsBF10x-3033.czi.png">
                </div>
            </div>
        </div>
    </div>
    <script src="assigment6.js"></script>
</body>
</html>
